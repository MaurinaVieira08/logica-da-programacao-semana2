<body>
    <script>
        let mes = parseInt(prompt("digite o número do mês"))

        switch (mes){
            case 12:
            case 1:
            case 2 :
                console.log("é um mês de verão! ")
            break;
            case 3:
            case 4:
            case 5:
                console.log("É um mês de outono ")
                break;
                default:
                    console.log("Digite de 1 a 12!")
        }
    </script>
